            /* #para{

            .paraclass{
                color:brown;
            }
            p{
                color:blueviolet;
            }

             /* universal selector(*) will be for everything */
            *{
                color:chartreuse;
            }

            /* id is unique for an element whereas class can be shared by many elements */
        </style>

        <link rel="stylesheet" href="first.css">
